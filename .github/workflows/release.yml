name: Release

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    build-and-release:
        runs-on: windows-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "21.4.0"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Publish to GitHub Releases
              run: npm run publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
